[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8", "Cython>=3.0", "numpy", "scipy"]
build-backend = "setuptools.build_meta"

[project]
name = "mut-var"
dynamic = ["version"]
description = "Mutation-variance inference and mixture-weight curve fitting"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = []
authors = [
  { name = "Nicholas Mancuso", email = "nmancuso@usc.edu" },
  { name = "Arun Durvasula", email = "arun.durvasula@med.usc.edu" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Cython",
  "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "polars",
]

[project.scripts]
mutvar = "mut_var.cli:run_cli"

[project.urls]
Documentation = "https://quattro.github.io/mut_var/"
Issues = "https://github.com/quattro/mut_var/issues"
Source = "https://github.com/quattro/mut_var"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.15",
    "ty>=0.0.44",
    "pre-commit>=4",
]
docs = [
    "mkdocstrings-python>=1.12",
    "mkdocstrings>=0.29",
    "zensical>=0.0.37",
]

[tool.setuptools_scm]
write_to = "src/mut_var/_version.py"
search_parent_directories = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mut_var" = []
"mut_var.numerics" = ["*.pyx", "*.pxd", "*.pyi"]

[tool.coverage.run]
source_pkgs = ["mut_var", "tests"]
branch = true
parallel = true
omit = [
  "src/mut_var/__about__.py",
]

[tool.coverage.paths]
mut_var = ["src/mut_var", "*/mut-var/src/mut_var"]
tests = ["tests", "*/mut-var/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]


[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
fixable = ["I001", "F401"]
select = ["E", "F", "I001"]
ignore = [
    # Allow non-abstract empty methods in abstract base classes
    "B027",
    # Allow boolean positional values in function calls, like `dict.get(... True)`
    "FBT003",
    # Ignore checks for possible passwords
    "S105", "S106", "S107",
    # Ignore complexity
    "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915",
]

[tool.ruff.lint.isort]
known-first-party = ["mut_var"]
combine-as-imports = true
lines-between-types = 1
known-local-folder = ["src"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
extra-standard-library = ["typing_extensions"]
order-by-type = false

[tool.ruff.lint.per-file-ignores]
# Tests can use magic values, assertions, and relative imports
"tests/**/*" = ["PLR2004", "S101", "TID252"]

[tool.pytest.ini_options]
addopts = "-p no:capture"
testpaths = ["tests"]

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
include = ["src", "tests", "scripts"]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_* *-win*"
build-frontend = "uv"
test-command = "python {project}/scripts/smoke_test.py"
