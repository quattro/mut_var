[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8", "Cython>=3.0", "numpy", "scipy"]
build-backend = "setuptools.build_meta"

[project]
name = "mut-var"
dynamic = ["version"]
description = ''
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = []
authors = [
  { name = "Nicholas Mancuso", email = "nmancuso@usc.edu" },
  { name = "Arun Durvasula", email = "arun.durvasula@med.usc.edu" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Cython",
  "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "polars",
]

[project.scripts]
mutvar = "mut_var.cli:run_cli"

[project.urls]
Documentation = "https://github.com/quattro/mut-var#readme"
Issues = "https://github.com/quattro/mut-var/issues"
Source = "https://github.com/quattro/mut-var"

[project.optional-dependencies]
docs = [
  "hippogriffe==0.2.2",
  "mkdocs==1.6.1",
  "mkdocs-include-exclude-files==0.1.0",
  "mkdocs-material==9.7.1",
  "mkdocstrings[python]==2.0.2",
  "pymdown-extensions==10.21"
]

[tool.setuptools_scm]
write_to = "src/mut_var/_version.py"
search_parent_directories = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mut_var" = []
"mut_var.numerics" = ["*.pyx", "*.pxd"]

[tool.coverage.run]
source_pkgs = ["mut_var", "tests"]
branch = true
parallel = true
omit = [
  "src/mut_var/__about__.py",
]

[tool.coverage.paths]
mut_var = ["src/mut_var", "*/mut-var/src/mut_var"]
tests = ["tests", "*/mut-var/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]


[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
fixable = ["I001", "F401"]
select = ["E", "F", "I001"]
ignore = [
    # Allow non-abstract empty methods in abstract base classes
    "B027",
    # Allow boolean positional values in function calls, like `dict.get(... True)`
    "FBT003",
    # Ignore checks for possible passwords
    "S105", "S106", "S107",
    # Ignore complexity
    "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915",
]
ignore-init-module-imports = true

[tool.ruff.lint.isort]
known-first-party = ["mut_var"]
combine-as-imports = true
lines-between-types = 1
known-local-folder = ["src"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
extra-standard-library = ["typing_extensions"]
order-by-type = false

[tool.ruff.lint.per-file-ignores]
# Tests can use magic values, assertions, and relative imports
"tests/**/*" = ["PLR2004", "S101", "TID252"]

[tool.pytest.ini_options]
addopts = "-p no:capture"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
files = ["src/mut_var", "tests"]
check_untyped_defs = true
warn_unused_ignores = false
ignore_missing_imports = true
follow_imports = "skip"
disable_error_code = ["arg-type", "index", "misc", "syntax", "valid-type", "var-annotated"]
