name: Build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      release-ref:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release-ref || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
      - run: uv build --sdist
      - name: Install and test the source distribution
        run: |
          uv venv /tmp/mutvar-sdist-smoke --python 3.12
          uv pip install --python /tmp/mutvar-sdist-smoke dist/*.tar.gz
          /tmp/mutvar-sdist-smoke/bin/python scripts/smoke_test.py
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  wheels:
    name: Wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release-ref || github.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v8.2.0
      - name: Build and test native wheels
        uses: pypa/cibuildwheel@v4.2.1
        env:
          CIBW_ARCHS: auto64
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: dist-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error
