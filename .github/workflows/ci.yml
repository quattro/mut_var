name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  quality-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ruff mypy pytest

      - name: Lint
        run: ruff check src/mut_var tests

      - name: Type Check
        run: mypy src/mut_var tests

      - name: Regression and Stability Tests
        run: pytest -p no:capture

      - name: Benchmark Contract Gate
        run: python benchmarks/infer_runtime.py --config benchmarks/config/runtime_baseline.json --output benchmarks/results/latest.json

      - name: Release Gate Contract Check
        run: python scripts/check_release_gate.py --report benchmarks/results/latest.json
