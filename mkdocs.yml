site_name: mut_var
site_description: Reproducible mutation-variance inference pipelines for CLI and Python callers.
site_url: https://quattro.github.io/mut-var

repo_url: https://github.com/quattro/mut-var
repo_name: quattro/mut-var
edit_uri: ""

docs_dir: docs/site
strict: false

theme:
  name: material
  features:
    - navigation.sections
    - toc.integrate
    - header.autohide
  palette:
    - scheme: default
      primary: white
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github
    logo: material/chart-bell-curve-cumulative
  favicon: _static/favicon.png
  custom_dir: docs/site/_overrides

extra_javascript:
  - _static/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - _static/custom_css.css

markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: "¤"
      toc_depth: 4

plugins:
  - search

nav:
  - Home: index.md
  - Installation: install.md
  - Quickstart: quickstart.md
  - CLI: cli.md
  - Python API: python-api.md
